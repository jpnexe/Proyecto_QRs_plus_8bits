<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#101010"/>
  
  <!-- Pixel Grid Pattern -->
  <pattern id="pixel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#1c1c1e" stroke-width="2"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#pixel-grid)"/>

  <!-- Arcade Border -->
  <rect x="20" y="20" width="1160" height="590" fill="none" stroke="#000000" stroke-width="12"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#3B82F6" stroke-width="4"/>

  <!-- Retro QR Icon -->
  <g transform="translate(100, 165)">
    <rect width="300" height="300" fill="#1c1c1e" stroke="#000000" stroke-width="8"/>
    <!-- Position pattern top-left -->
    <rect x="30" y="30" width="80" height="80" fill="#E03B24" stroke="#000000" stroke-width="6"/>
    <rect x="50" y="50" width="40" height="40" fill="#101010"/>
    <!-- Position pattern top-right -->
    <rect x="190" y="30" width="80" height="80" fill="#10B981" stroke="#000000" stroke-width="6"/>
    <rect x="210" y="50" width="40" height="40" fill="#101010"/>
    <!-- Position pattern bottom-left -->
    <rect x="30" y="190" width="80" height="80" fill="#F2C94C" stroke="#000000" stroke-width="6"/>
    <rect x="50" y="210" width="40" height="40" fill="#101010"/>
    <!-- Module dots -->
    <rect x="140" y="140" width="30" height="30" fill="#3B82F6"/>
    <rect x="190" y="150" width="30" height="30" fill="#56C596"/>
    <rect x="150" y="210" width="30" height="30" fill="#E03B24"/>
    <rect x="230" y="220" width="30" height="30" fill="#F2C94C"/>
  </g>

  <!-- Title & Tagline -->
  <text x="450" y="250" font-family="monospace" font-size="52" font-weight="900" fill="#F2C94C" letter-spacing="4">
    PROYECTO QR PLUS
  </text>
  <text x="450" y="320" font-family="monospace" font-size="28" font-weight="700" fill="#3B82F6">
    ⚡ Generador Retro de Códigos QR
  </text>
  <text x="450" y="380" font-family="sans-serif" font-size="22" fill="#a1a1aa">
    Personalización 8-Bit &bull; Alta Tolerancia &bull; Jamstack SSG
  </text>

  <!-- Badge -->
  <rect x="450" y="430" width="260" height="48" fill="#E03B24" stroke="#000000" stroke-width="4"/>
  <text x="470" y="462" font-family="monospace" font-size="18" font-weight="700" fill="#FFFFFF">
    100% STATIC &bull; PRIVADO
  </text>
</svg>
